services:
  lrc-sync:
    build:
      context: .
    container_name: ${LRCSYNC_CONTAINER_NAME:-lrc-sync}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - RUST_LOG=${RUST_LOG:-info}
      - LRCSYNC_CONCURRENCY=${LRCSYNC_CONCURRENCY:-8}
      - LRCSYNC_CLEAN_FALLBACK=${LRCSYNC_CLEAN_FALLBACK:-true}
      - LRCSYNC_RETRY_NOT_FOUND_DAYS=${LRCSYNC_RETRY_NOT_FOUND_DAYS:-7}
      - LRCSYNC_REQUEST_INTERVAL_MS=${LRCSYNC_REQUEST_INTERVAL_MS:-750}
      - LRCSYNC_REQUEST_TIMEOUT_SECONDS=${LRCSYNC_REQUEST_TIMEOUT_SECONDS:-30}
      - LRCSYNC_ORPHAN_ACTION=${LRCSYNC_ORPHAN_ACTION:-keep}
      - LRCSYNC_FALLBACK_SCAN_SECONDS=${LRCSYNC_FALLBACK_SCAN_SECONDS:-300}
      - LRCSYNC_FOLLOW_SYMLINKS=${LRCSYNC_FOLLOW_SYMLINKS:-false}
      - LRCSYNC_WATCH_MODE=${LRCSYNC_WATCH_MODE:-poll}
      - LRCSYNC_POLL_INTERVAL_SECONDS=${LRCSYNC_POLL_INTERVAL_SECONDS:-30}
      - LRCSYNC_MAX_PENDING_DIRS=${LRCSYNC_MAX_PENDING_DIRS:-128}
      - LRCSYNC_DB_PATH=/config/cache.sqlite3
      - LRCSYNC_MUSIC_DIR=/music
    volumes:
      - ${LRCSYNC_CONFIG_DIR:-./config}:/config
      - ${LRCSYNC_MUSIC_VOLUME:-./music}:/music
    stop_grace_period: ${LRCSYNC_STOP_GRACE_PERIOD:-45s}
    restart: unless-stopped
