services:
  lrcget:
    build:
      context: .
    container_name: ${LRCGET_CONTAINER_NAME:-lrcget}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - LRCGET_CONCURRENCY=${LRCGET_CONCURRENCY:-8}
      - LRCGET_CLEAN_FALLBACK=${LRCGET_CLEAN_FALLBACK:-true}
      - LRCGET_RETRY_NOT_FOUND_DAYS=${LRCGET_RETRY_NOT_FOUND_DAYS:-7}
      - LRCGET_REQUEST_INTERVAL_MS=${LRCGET_REQUEST_INTERVAL_MS:-750}
      - LRCGET_REQUEST_TIMEOUT_SECONDS=${LRCGET_REQUEST_TIMEOUT_SECONDS:-30}
      - LRCGET_ORPHAN_ACTION=${LRCGET_ORPHAN_ACTION:-keep}
      - LRCGET_FALLBACK_SCAN_SECONDS=${LRCGET_FALLBACK_SCAN_SECONDS:-43200}
      - LRCGET_FOLLOW_SYMLINKS=${LRCGET_FOLLOW_SYMLINKS:-false}
    volumes:
      - ${LRCGET_CONFIG_DIR:-./config}:/config
      - ${LRCGET_MUSIC_DIR:-./music}:/music
    restart: unless-stopped
